<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ahmed Ramadan Tanany — LinkedIn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<!-- ===================================================================
     THE ONLY LINE YOU EVER EDIT IS THE NEXT ONE.

     Change the URL below when your LinkedIn account changes, commit,
     push. Every resume already printed with itstanany.github.io/in
     starts resolving to the new profile - no reprint, no re-send.

     GitHub Pages cannot issue a real 301, so this page redirects three
     independent ways: meta refresh, JavaScript, and a visible link that
     works when both are blocked (some corporate mail gateways strip
     scripts and refreshes from previewed pages).
     =================================================================== -->
<link rel="canonical" href="https://www.linkedin.com/in/itstanany/">
<meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/itstanany/">

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #111; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  a { color: #0a66c2; }
  .hint { font-size: 14px; opacity: .7; margin-top: 18px; }
</style>
</head>
<body>
  <main>
    <p>Redirecting to the LinkedIn profile of <strong>Ahmed Ramadan Tanany</strong>&hellip;</p>
    <p><a id="target" href="https://www.linkedin.com/in/itstanany/">Continue to LinkedIn</a></p>
    <p class="hint">If nothing happens, use the link above.</p>
  </main>
  <script>
    // Third fallback: mirrors the href already in the markup, so there is no
    // second copy of the URL to forget to update.
    var t = document.getElementById('target');
    if (t && t.href) location.replace(t.href);
  </script>
</body>
</html>
